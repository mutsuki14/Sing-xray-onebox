name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          bash -n onebox.sh
          for test in tests/*.sh; do bash -n "$test"; done
      - name: shellcheck
        run: shellcheck -s bash -S warning onebox.sh tests/*.sh
      - name: unit tests
        run: bash tests/unit.sh
      - name: Owned-domain REALITY site regressions
        run: bash tests/site.sh
      - name: Failure-path and compatibility regressions
        run: |
          for test in tests/updates.sh tests/transactions.sh tests/site-recovery.sh tests/system.sh tests/config-regressions.sh tests/site-https.sh; do
            bash "$test" || exit 1
          done

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract nginx config checker without installing a system service
        run: |
          set -euo pipefail
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/nginx-package" "$RUNNER_TEMP/nginx-root"
          cd "$RUNNER_TEMP/nginx-package"
          apt-get download nginx
          dpkg-deb -x nginx_*.deb "$RUNNER_TEMP/nginx-root"
          test -x "$RUNNER_TEMP/nginx-root/usr/sbin/nginx"
      - name: Validate generated nginx configs with a real nginx binary
        run: sudo env ONEBOX_TEST_NGINX="$RUNNER_TEMP/nginx-root/usr/sbin/nginx" bash tests/site.sh

      - name: HTTPS 443 reverse proxy through real nginx
        run: sudo env ONEBOX_TEST_NGINX="$RUNNER_TEMP/nginx-root/usr/sbin/nginx" bash tests/site-https-e2e.sh

      - name: Download cores with the script's own installer functions
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bin"
          ONEBOX_SOURCE_ONLY=1 ONEBOX_BIN_DIR="$RUNNER_TEMP/bin" bash -c '
            . ./onebox.sh
            detect_os; detect_arch
            install_singbox
            install_xray
          '
          "$RUNNER_TEMP/bin/sing-box" version
          "$RUNNER_TEMP/bin/xray" version

      - name: Download mihomo
        run: |
          set -e
          url=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9.]+\\.gz$")) | .browser_download_url' | head -n1)
          echo "mihomo asset: $url"
          curl -fsSL "$url" | gunzip > "$RUNNER_TEMP/bin/mihomo"
          chmod +x "$RUNNER_TEMP/bin/mihomo"
          "$RUNNER_TEMP/bin/mihomo" -v

      - name: Owned-domain REALITY website through real nginx and both cores
        run: |
          sudo env SB="$RUNNER_TEMP/bin/sing-box" XR="$RUNNER_TEMP/bin/xray" \
            ONEBOX_TEST_NGINX="$RUNNER_TEMP/nginx-root/usr/sbin/nginx" bash tests/site-e2e.sh

      - name: End-to-end matrix (protocol x server core x client)
        run: |
          SB="$RUNNER_TEMP/bin/sing-box" XR="$RUNNER_TEMP/bin/xray" MH="$RUNNER_TEMP/bin/mihomo" VERBOSE=1 bash tests/e2e.sh

      - name: Installer lifecycle
        run: |
          sudo env ONEBOX_LIFECYCLE=1 SB="$RUNNER_TEMP/bin/sing-box" XR="$RUNNER_TEMP/bin/xray" MH="$RUNNER_TEMP/bin/mihomo" \
            bash tests/lifecycle.sh
