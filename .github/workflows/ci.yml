name: CI

on:
  push:
    # Branches only: a release tag points at a main commit CI has already tested.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull-request runs are cancelled. Push runs are never cancelled
  # once started, and the newest push of a branch always runs to completion (a
  # pending older one may be dropped); release.yml only needs the run for main HEAD.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.99.0
  # Official cross main, pinned after verifying the upstream Git reference (same as release.yml).
  CROSS_REV: 74e99b2223de06166f8cdcc1af7f1308ec52baf4
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Single version source (Cargo.toml, Cargo.lock, onebox.sh)
        run: scripts/check-version.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      # The script checks below also run when a Rust step failed.
      - name: Install busybox so the launcher is also tested with its ash and applets (Alpine)
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox
      - name: Launcher and shell scripts
        if: ${{ !cancelled() }}
        env:
          # shellcheck aborts when printing the Chinese messages under a non-UTF-8 locale.
          LC_ALL: C.UTF-8
          # Listed explicitly, so a shell that cannot be tested fails the job instead of being skipped.
          ONEBOX_BOOTSTRAP_TEST_SHELLS: sh bash dash busybox
        run: |
          set -euo pipefail
          sh -n onebox.sh
          bash -n tests/bootstrap.sh
          shellcheck -S warning onebox.sh scripts/check-version.sh tests/bootstrap.sh
          bash tests/bootstrap.sh
      - name: Python test helpers and tool manifest
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tests/fetch_tools.py --check
          find tests -name '*.py' -not -path '*/__pycache__/*' -print0 | xargs -0 -r python3 -m py_compile

  integration:
    name: Integration with real cores, FRP and nginx
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build the program and every test target (as the runner user)
        run: |
          cargo build --locked
          cargo test --locked --all-targets --no-run
      - name: Fetch official cores and FRP (pinned in tests/tools.json, SHA-256 verified)
        id: tools
        env:
          # Only the fetcher calls the GitHub API: builds and tests never see the token.
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/fetch_tools.py "$RUNNER_TEMP/bin"
      - name: Extract nginx without starting a system service
        id: nginx
        run: |
          set -euo pipefail
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/nginx-package" "$RUNNER_TEMP/nginx-root"
          cd "$RUNNER_TEMP/nginx-package"
          apt-get download nginx
          dpkg-deb -x nginx_*.deb "$RUNNER_TEMP/nginx-root"
          test -x "$RUNNER_TEMP/nginx-root/usr/sbin/nginx"
          "$RUNNER_TEMP/nginx-root/usr/sbin/nginx" -v
      - name: Fetch the released Onebox v2.0.1 for the upgrade suite (pinned SHA-256)
        env:
          # tests/e2e/upgrade.py upgrades nodes installed by the v2.0.1 release
          # in place. The published static asset is used, not a source build:
          # it is the exact program v2 hosts run, and needs no second toolchain.
          # Its digest is pinned here, so a replaced release asset fails CI
          # instead of being trusted through the SHA256SUMS of the same release.
          V2_BASE: https://github.com/mutsuki14/Sing-xray-onebox/releases/download/v2.0.1
          V2_ASSET: onebox-linux-amd64-musl
          V2_SHA256: df929290d37855b5547940ce2b4b062f667526028b55351d901074d28cef881d
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/onebox-v2"
          mkdir -p "$dir"
          cd "$dir"
          for file in "$V2_ASSET" SHA256SUMS; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-all-errors --max-time 300 --output "$file" "$V2_BASE/$file"
          done
          listed=$(awk -v name="$V2_ASSET" '$2 == name || $2 == "*" name { print $1 }' SHA256SUMS)
          if [[ "$listed" != "$V2_SHA256" ]]; then
            echo "::error::SHA256SUMS lists '$listed' for $V2_ASSET, expected the pinned $V2_SHA256"
            exit 1
          fi
          echo "$V2_SHA256  $V2_ASSET" | sha256sum --check --strict
          chmod 755 "$V2_ASSET"
          reported=$("./$V2_ASSET" version)
          if [[ "$reported" != 2.0.1 ]]; then
            echo "::error::$V2_ASSET version printed '$reported', expected 2.0.1"
            exit 1
          fi
      - name: Check the real tool paths and record them for the test steps
        id: paths
        run: |
          # The paths stay out of GITHUB_ENV: only the two test steps below get
          # them, explicitly, from real-tools.env (one KEY=VALUE per line).
          # ONEBOX_TEST_REQUIRE_FULL=1 is the contract for every test that needs
          # root or one of these tools (Rust helpers that look a tool variable up,
          # every e2e suite): a missing variable, tool or privilege is a failure
          # (Rust: panic), never a skip.
          set -euo pipefail
          tools=(
            "ONEBOX_TEST_BINARY=$GITHUB_WORKSPACE/target/debug/onebox"
            "ONEBOX_TEST_SINGBOX=$RUNNER_TEMP/bin/sing-box"
            "ONEBOX_TEST_XRAY=$RUNNER_TEMP/bin/xray"
            "ONEBOX_TEST_MIHOMO=$RUNNER_TEMP/bin/mihomo"
            "ONEBOX_FRPS_BIN=$RUNNER_TEMP/bin/frps"
            "ONEBOX_FRPC_BIN=$RUNNER_TEMP/bin/frpc"
            "ONEBOX_NGINX_BIN=$RUNNER_TEMP/nginx-root/usr/sbin/nginx"
            "ONEBOX_TEST_V2_BINARY=$RUNNER_TEMP/onebox-v2/onebox-linux-amd64-musl"
          )
          for entry in "${tools[@]}"; do
            if [[ ! -f "${entry#*=}" || ! -x "${entry#*=}" ]]; then
              echo "::error::${entry%%=*} is not an executable file: ${entry#*=}"
              exit 1
            fi
          done
          # Each tool must also run on this runner (right architecture, complete).
          "$RUNNER_TEMP/bin/sing-box" version
          "$RUNNER_TEMP/bin/xray" version
          "$RUNNER_TEMP/bin/mihomo" -v
          "$RUNNER_TEMP/bin/frps" --version
          "$RUNNER_TEMP/bin/frpc" --version
          "$RUNNER_TEMP/nginx-root/usr/sbin/nginx" -v
          "$GITHUB_WORKSPACE/target/debug/onebox" --version
          "$RUNNER_TEMP/onebox-v2/onebox-linux-amd64-musl" version
          printf '%s\n' "${tools[@]}" ONEBOX_TEST_REQUIRE_FULL=1 > "$RUNNER_TEMP/real-tools.env"
      - name: Unit, ignored and real-process Rust tests (root, one thread)
        # --all-targets leaves out doctests (lint runs them): --include-ignored
        # would otherwise try to run `ignore` code blocks.
        run: |
          set -euo pipefail
          mapfile -t tools < "$RUNNER_TEMP/real-tools.env"
          sudo -E env PATH="$PATH" RUSTUP_HOME="$(rustup show home)" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            "${tools[@]}" cargo test --locked --all-targets --no-fail-fast -- --include-ignored --test-threads=1
      - name: Return build outputs to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target "${CARGO_HOME:-$HOME/.cargo}"
      - name: Black-box suites (tests/e2e/*.py, root)
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        run: |
          # Contract for every tests/e2e/*.py (helper modules are named _*.py
          # and are not run directly):
          # - the suite runs ONCE, as root, with RUSTC (for compiling fake
          #   cores) and every KEY=VALUE of real-tools.env: the real-core and
          #   tool variables are ALWAYS set, and ONEBOX_TEST_REQUIRE_FULL=1
          #   turns every skip (not root, missing tool) into a failure;
          # - a suite with a fake-core mode still runs its fake-core cases in
          #   that same run: the start-failure injection, retained journal and
          #   `recover` cases of the lifecycle suite exist only with the fake
          #   core. The real core adds a pass; it never replaces the fake one.
          set -uo pipefail
          mapfile -t tools < "$RUNNER_TEMP/real-tools.env" || exit 1
          shopt -s nullglob
          suites=()
          for suite in tests/e2e/*.py; do
            [[ $(basename "$suite") == _* ]] || suites+=("$suite")
          done
          if [[ ${#suites[@]} -eq 0 ]]; then
            echo 'No black-box suites in tests/e2e yet.'
            exit 0
          fi
          failed=()
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            sudo -E env PATH="$PATH" RUSTC="$(rustup which rustc)" "${tools[@]}" python3 "$suite" || failed+=("$suite")
            echo '::endgroup::'
          done
          for suite in "${failed[@]}"; do
            echo "::error::black-box suite failed: $suite"
          done
          [[ ${#failed[@]} -eq 0 ]]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: integration-debug-tools
          path: |
            ${{ runner.temp }}/bin/*
            target/debug/onebox
          if-no-files-found: ignore
          retention-days: 2

  cross:
    name: Static build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
          # "386" is the conventional 32-bit asset name; minimum CPU is i586.
          - target: i586-unknown-linux-musl
            arch: '386'
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and cross source revision
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo +"$RUST_TOOLCHAIN" install cross --locked --git https://github.com/cross-rs/cross --rev "$CROSS_REV"
      - name: Resolve the official build image to an immutable digest
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          image="ghcr.io/cross-rs/$TARGET"
          docker pull "$image:main"
          digest=$(docker image inspect "$image:main" --format '{{index .RepoDigests 0}}')
          [[ "$digest" == "$image@sha256:"* && "${digest##*@sha256:}" =~ ^[0-9a-f]{64}$ ]]
          printf '[target.%s]\nimage = "%s"\n' "$TARGET" "$digest" > "$RUNNER_TEMP/Cross.toml"
          printf 'CROSS_CONFIG=%s\nBUILD_IMAGE=%s\n' "$RUNNER_TEMP/Cross.toml" "$digest" >> "$GITHUB_ENV"
          echo "Build image: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the static executable and run its version command for this CPU
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -euo pipefail
          version=$(scripts/check-version.sh)
          cross +"$RUST_TOOLCHAIN" build --release --locked --target "$TARGET"
          reported=$(cross +"$RUST_TOOLCHAIN" run --release --locked --target "$TARGET" -- --version)
          if [[ "$reported" != "$version" ]]; then
            echo "::error::--version printed '$reported', expected '$version'"
            exit 1
          fi
          binary="target/$TARGET/release/onebox"
          readelf --file-header "$binary"
          if readelf --program-headers "$binary" | grep -q INTERP; then
            echo '::error::the executable unexpectedly requires a dynamic loader'
            exit 1
          fi
      - name: Record the tested build image for release.yml
        run: |
          mkdir -p "$RUNNER_TEMP/cross-image"
          printf '%s\n' "$BUILD_IMAGE" > "$RUNNER_TEMP/cross-image/image"
      # release.yml builds in exactly the image this run tested (by digest).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/cross-image/image
          if-no-files-found: error
          retention-days: 90
          overwrite: true
