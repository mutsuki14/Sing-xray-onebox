name: Native CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt && rustup default 1.99.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Thin bootstrap checks
        run: |
          bash -n onebox.sh scripts/bootstrap.sh tests/bootstrap.sh
          shellcheck -s bash -S warning onebox.sh scripts/bootstrap.sh tests/bootstrap.sh
          bash tests/bootstrap.sh
          cmp onebox.sh scripts/bootstrap.sh
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt && rustup default 1.99.0
      - run: cargo build --locked && cargo test --lib --no-run --locked
      - name: Official cores and FRP (SHA256 verified)
        run: python3 tests/fetch_tools.py "$RUNNER_TEMP/bin"
      - name: Extract nginx without starting a system service
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/nginx-package" "$RUNNER_TEMP/nginx-root"
          cd "$RUNNER_TEMP/nginx-package"
          apt-get download nginx
          dpkg-deb -x nginx_*.deb "$RUNNER_TEMP/nginx-root"
          test -x "$RUNNER_TEMP/nginx-root/usr/sbin/nginx"
      - name: Real protocol and client matrix
        env:
          ONEBOX_TEST_BINARY: ${{ github.workspace }}/target/debug/onebox
          ONEBOX_TEST_SINGBOX: ${{ runner.temp }}/bin/sing-box
          ONEBOX_TEST_XRAY: ${{ runner.temp }}/bin/xray
          MH: ${{ runner.temp }}/bin/mihomo
        run: python3 tests/native_e2e.py
      - name: Real private-address policy and shared REALITY port
        if: always()
        env:
          ONEBOX_TEST_BINARY: ${{ github.workspace }}/target/debug/onebox
          ONEBOX_TEST_SINGBOX: ${{ runner.temp }}/bin/sing-box
          ONEBOX_TEST_XRAY: ${{ runner.temp }}/bin/xray
        run: python3 tests/native_policy.py
      - name: Native lifecycle, rollback, recovery and legacy migration
        if: always()
        run: |
          sudo env PATH="$PATH" RUSTC="$(rustup which rustc)" ONEBOX_TEST_BINARY="$PWD/target/debug/onebox" python3 tests/native_lifecycle.py --require-full
          sudo env PATH="$PATH" RUSTC="$(rustup which rustc)" ONEBOX_TEST_BINARY="$PWD/target/debug/onebox" ONEBOX_TEST_SINGBOX="$RUNNER_TEMP/bin/sing-box" python3 tests/native_lifecycle.py --require-full
      - name: Real runtime clients, FRP and HTTPS subscription service
        if: always()
        run: |
          testbin=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'onebox-*' | while read -r b; do "$b" --list 2>/dev/null | grep -q 'subscription::e2e::' && { echo "$b"; break; }; done)
          test -n "$testbin"
          sudo env RUSTC="$(rustup which rustc)" ONEBOX_TEST_BINARY="$PWD/target/debug/onebox" \
            ONEBOX_TEST_SINGBOX="$RUNNER_TEMP/bin/sing-box" ONEBOX_TEST_XRAY="$RUNNER_TEMP/bin/xray" \
            ONEBOX_FRPS_BIN="$RUNNER_TEMP/bin/frps" ONEBOX_FRPC_BIN="$RUNNER_TEMP/bin/frpc" \
            ONEBOX_NGINX_BIN="$RUNNER_TEMP/nginx-root/usr/sbin/nginx" \
            "$testbin" --include-ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-debug-tools
          path: |
            ${{ runner.temp }}/bin/*
            ${{ github.workspace }}/target/debug/onebox
          retention-days: 2
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, i586-unknown-linux-musl, armv7-unknown-linux-musleabihf]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt && rustup default 1.99.0
      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 74e99b2223de06166f8cdcc1af7f1308ec52baf4
      - name: Build and run static binary
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          printf '[target.%s]\nimage = "ghcr.io/cross-rs/%s:main"\n' "$TARGET" "$TARGET" > Cross.toml
          cross build --release --locked --target "$TARGET"
          cross run --release --locked --target "$TARGET" -- --version
          if readelf --program-headers "target/$TARGET/release/onebox" | grep -q INTERP; then exit 1; fi
