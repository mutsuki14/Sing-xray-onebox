name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and merged commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}$ ]]
          version=$(sed -n 's/^readonly SCRIPT_VERSION="\([^"]*\)"$/\1/p' onebox.sh)
          test "v$version" = "$RELEASE_TAG"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD FETCH_HEAD
          bash -n onebox.sh
      - name: Validate release and update behavior
        run: |
          set -euo pipefail
          bash tests/unit.sh
          bash tests/updates.sh
          bash tests/releases.sh
      - name: Package script and checksum
        run: |
          set -euo pipefail
          mkdir dist
          install -m 755 onebox.sh dist/onebox.sh
          cd dist
          sha256sum onebox.sh > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/onebox.sh dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Sing-Xray-Onebox $RELEASE_TAG" --latest
